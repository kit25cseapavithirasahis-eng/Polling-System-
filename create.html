{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Create New Poll</h2>
    <p>Ask a question and provide multiple options for users to vote on.</p>
    
    <form method="POST" action="{{ url_for('create') }}" id="createForm">
        <div class="form-group">
            <label for="question">Poll Question</label>
            <input type="text" id="question" name="question" required placeholder="What is your favorite framework?">
        </div>
        
        <div id="choices-container">
            <label>Choices</label>
            <div class="dynamic-choice-container">
                <input type="text" name="choices" required placeholder="Choice 1">
            </div>
            <div class="dynamic-choice-container">
                <input type="text" name="choices" required placeholder="Choice 2">
            </div>
        </div>
        
        <div style="margin-bottom: 2rem;">
            <button type="button" class="btn" style="background: rgba(255,255,255,0.1); color: var(--text-color);" id="addChoiceBtn">+ Add another choice</button>
        </div>
        
        <button type="submit" class="btn" style="width: 100%;">Publish Poll</button>
    </form>
</div>

<script>
    document.getElementById('addChoiceBtn').addEventListener('click', function() {
        const container = document.getElementById('choices-container');
        const count = container.querySelectorAll('.dynamic-choice-container').length + 1;
        
        const div = document.createElement('div');
        div.className = 'dynamic-choice-container';
        div.style.display = 'flex';
        div.style.gap = '10px';
        div.style.animation = 'fadeIn 0.3s ease-out forwards';
        
        const input = document.createElement('input');
        input.type = 'text';
        input.name = 'choices';
        input.placeholder = 'Choice ' + count;
        input.required = true;
        
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'btn btn-danger';
        removeBtn.innerText = 'X';
        removeBtn.style.padding = '0.75rem';
        removeBtn.onclick = function() {
            container.removeChild(div);
        };
        
        div.appendChild(input);
        div.appendChild(removeBtn);
        container.appendChild(div);
    });
</script>
{% endblock %}
